<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Duru's Aardrijkskunde 🗺️ — HAVO 3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand" onclick="DURU.gaNaar('home')">
        <div class="logo">🗺️</div>
        <div>
          <h1>Duru's Aardrijkskunde</h1>
          <small>Aardrijkskunde voor HAVO 3</small>
        </div>
      </div>
      <div class="stats">
        <span class="chip xp" title="Jouw punten">💎 <span id="stat-xp">0</span> <span class="lbl">XP</span></span>
        <span class="chip streak" title="Hoeveel vragen achter elkaar goed">🔥 <span id="stat-streak">0</span></span>
        <span class="chip medal" title="Behaalde medailles">🏅 <span id="stat-badges">0</span></span>
      </div>
    </div>
  </header>

  <main class="app" id="app"><!-- views worden hier gerenderd --></main>

  <div id="toast"></div>
  <canvas id="confetti"></canvas>

  <!-- ====== Bootstrap (maakt DURU.register klaar voor de data) ====== -->
  <script src="js/bootstrap.js?v=3.8"></script>

  <!-- ====== Examen-motor + proeftoetsen (Hoofdstuk 1 & 2: 10 toetsen x 20 vragen) ====== -->
  <script src="js/exams.js?v=3.8"></script>
  <script src="js/data/examen_1.js?v=3.8"></script>
  <script src="js/data/examen_2.js?v=3.8"></script>
  <script src="js/data/examen_3.js?v=3.8"></script>
  <script src="js/data/examen_4.js?v=3.8"></script>
  <script src="js/data/examen_5.js?v=3.8"></script>
  <script src="js/data/examen_6.js?v=3.8"></script>
  <script src="js/data/examen_7.js?v=3.8"></script>
  <script src="js/data/examen_8.js?v=3.8"></script>
  <script src="js/data/examen_9.js?v=3.8"></script>
  <script src="js/data/examen_10.js?v=3.8"></script>

  <!-- ====== Onderwerpen (oefenquizzes per paragraaf H1 & H2) ====== -->
  <script src="js/data/h1_1.js?v=3.8"></script>
  <script src="js/data/h1_2.js?v=3.8"></script>
  <script src="js/data/h1_3.js?v=3.8"></script>
  <script src="js/data/h1_4.js?v=3.8"></script>
  <script src="js/data/h1_5.js?v=3.8"></script>
  <script src="js/data/h2_1.js?v=3.8"></script>
  <script src="js/data/h2_2.js?v=3.8"></script>
  <script src="js/data/h2_3.js?v=3.8"></script>
  <script src="js/data/h2_4.js?v=3.8"></script>
  <script src="js/data/h2_5.js?v=3.8"></script>

  <!-- ====== Engine (moet als LAATSTE laden) ====== -->
  <script src="js/engine.js?v=3.8"></script>

</html>
